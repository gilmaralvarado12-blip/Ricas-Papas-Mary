{% extends 'gestion_web/base.html' %}
{% block content %}
<div class="tarjeta" data-animate-module style="max-width: 820px; margin: 0 auto;">
    <h2>{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar</button>
            <a class="btn btn-order-neutral" href="{% url 'usuarios:lista_usuarios' %}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver</a>
        </div>
    </form>
</div>
{% endblock %}
